name: CI/CD Pipeline

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30  # Add overall timeout
    
    strategy:
      fail-fast: false  # Don't cancel other jobs if one fails
      matrix:
        node-version: [18.x]  # Reduce matrix to speed up
        service: [auth-service, property-service, room-service, tenant-service]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        timeout-minutes: 5
      
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: '${{ matrix.service }}/package-lock.json'
        timeout-minutes: 5
      
      - name: Clean npm cache
        working-directory: ./${{ matrix.service }}
        run: npm cache clean --force
        timeout-minutes: 2
      
      - name: Install dependencies with retry
        working-directory: ./${{ matrix.service }}
        timeout-minutes: 10
        run: |
          for i in {1..3}; do
            echo "Attempt $i to install dependencies..."
            if npm ci --prefer-offline --audit-level=moderate; then
              echo "Dependencies installed successfully"
              break
            else
              echo "Installation failed, retrying in 10 seconds..."
              sleep 10
            fi
            if [ $i -eq 3 ]; then
              echo "Failed to install dependencies after 3 attempts"
              exit 1
            fi
          done
      
      - name: Fix vulnerabilities
        working-directory: ./${{ matrix.service }}
        run: npm audit fix --force || echo "Some vulnerabilities couldn't be fixed automatically"
        timeout-minutes: 5
      
      - name: Run tests
        working-directory: ./${{ matrix.service }}
        run: |
          if [ -f "package.json" ] && grep -q '"test"' package.json; then
            npm test
          else
            echo "No tests found for ${{ matrix.service }}, skipping..."
          fi
        timeout-minutes: 10
      
      - name: Build application
        working-directory: ./${{ matrix.service }}
        run: npm run build --if-present || echo "No build script found"
        timeout-minutes: 5

  # ✅ Security Scan
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'

  # ✅ Build Docker Images
  build-images:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [test, security-scan]
    if: github.ref == 'refs/heads/main'
    
    strategy:
      matrix:
        service: [
          auth-service, 
          property-service,
          room-service,
          tenant-service,
          complaint-service,
          notification-service,
          kitchen-service,
          dashboard-service,
          payment-service,
          gateway,
          websocket-service
        ]

    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}
      
      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ✅ Deploy to Staging
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build-images
    if: github.ref == 'refs/heads/develop'
    environment: staging
    
    steps:
      - name: Deploy to staging server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            cd /opt/pgpaal-staging
            docker compose -f docker-compose.staging.yml pull
            docker compose -f docker-compose.staging.yml up -d
            docker system prune -f

  # ✅ Deploy to Production
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build-images
    if: github.ref == 'refs/heads/main'
    environment: production
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Deploy to production server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            cd /opt/pgpaal-production
            
            # Backup current deployment
            docker compose -f docker-compose.prod.yml exec -T postgres pg_dump -U pgpaal_user pgpaal_db > backup-$(date +%Y%m%d-%H%M%S).sql
            
            # Pull latest images
            docker compose -f docker-compose.prod.yml pull
            
            # Rolling update with health checks
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            
            # Wait for health checks
            sleep 30
            
            # Verify deployment
            curl -f http://localhost:4001/health || exit 1
            curl -f http://localhost:4002/health || exit 1
            curl -f http://localhost:4003/health || exit 1
            curl -f http://localhost:4004/health || exit 1
            
            # Cleanup old images
            docker system prune -f

  # ✅ Notify deployment status
  notify:
    name: Notify Deployment
    runs-on: ubuntu-latest
    needs: [deploy-production]
    if: always()
    
    steps:
      - name: Notify Slack
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
          text: "PGPaal deployment ${{ job.status }} on production!"