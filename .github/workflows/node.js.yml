# .github/workflows/node.js.yml
name: CI/CD Pipeline

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    strategy:
      fail-fast: false
      matrix:
        node-version: [18.x]
        service: [
          auth-service, 
          property-service, 
          room-service, 
          tenant-service,
          complaint-service,
          kitchen-service,
          dashboard-service,
          notification-service,
          payment-service,
          gateway  # ✅ Use 'gateway' instead of 'websocket-service'
        ]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        timeout-minutes: 5
      
      - name: Check if service exists
        id: check-service
        run: |
          if [ -d "${{ matrix.service }}" ] && [ -f "${{ matrix.service }}/package.json" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Service ${{ matrix.service }} found"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Service ${{ matrix.service }} does not exist or has no package.json"
          fi
      
      - name: Setup Node.js ${{ matrix.node-version }}
        if: steps.check-service.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: '${{ matrix.service }}/package-lock.json'
        timeout-minutes: 5
      
      - name: Install dependencies
        if: steps.check-service.outputs.exists == 'true'
        working-directory: ./${{ matrix.service }}
        timeout-minutes: 10
        run: |
          npm ci --prefer-offline --audit-level=moderate || npm ci --force
      
      - name: Run tests
        if: steps.check-service.outputs.exists == 'true'
        working-directory: ./${{ matrix.service }}
        run: |
          if grep -q '"test"' package.json && ! grep -q 'exit 1' package.json; then
            npm test
          else
            echo "No tests found for ${{ matrix.service }}, skipping..."
          fi
        timeout-minutes: 10

  build-images:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [test]
    if: github.ref == 'refs/heads/main'
    
    strategy:
      matrix:
        service-config: [
          { name: auth-service, dockerfile: dockerfile, context: auth-service },
          { name: property-service, dockerfile: dockerfile, context: property-service },
          { name: room-service, dockerfile: dockerfile, context: room-service },
          { name: tenant-service, dockerfile: dockerfile, context: tenant-service },
          { name: complaint-service, dockerfile: dockerfile, context: complaint-service },
          { name: kitchen-service, dockerfile: dockerfile, context: kitchen-service },
          { name: dashboard-service, dockerfile: dockerfile, context: dashboard-service },
          { name: notification-service, dockerfile: dockerfile, context: notification-service },
          { name: payment-service, dockerfile: dockerfile, context: payment-service },
          { name: gateway, dockerfile: dockerfile, context: gateway },
          { name: websocket-gateway, dockerfile: dockerfile.websocket, context: gateway }
        ]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Check if service has Dockerfile
        id: check-dockerfile
        run: |
          if [ -f "${{ matrix.service-config.context }}/${{ matrix.service-config.dockerfile }}" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Found Dockerfile for ${{ matrix.service-config.name }}"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "No Dockerfile found for ${{ matrix.service-config.name }}"
          fi
      
      - name: Set up Docker Buildx
        if: steps.check-dockerfile.outputs.exists == 'true'
        uses: docker/setup-buildx-action@v3
      
      - name: Login to Container Registry
        if: steps.check-dockerfile.outputs.exists == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Extract metadata
        if: steps.check-dockerfile.outputs.exists == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.service-config.name }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}
      
      - name: Build and push Docker image
        if: steps.check-dockerfile.outputs.exists == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service-config.context }}
          file: ./${{ matrix.service-config.context }}/${{ matrix.service-config.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ✅ Deploy to Production with all services health checks
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build-images
    if: github.ref == 'refs/heads/main'
    environment: production
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Deploy to production server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/pgpaal-production
            
            # Backup current deployment
            docker compose -f docker-compose.prod.yml exec -T postgres pg_dump -U pgpaal_user pgpaal_db > backup-$(date +%Y%m%d-%H%M%S).sql
            
            # Pull latest images
            docker compose -f docker-compose.prod.yml pull
            
            # Rolling update with health checks
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            
            # Wait for health checks
            sleep 30
            
            # Verify deployment for all services
            curl -f http://46.62.142.3:4001/health || echo "auth-service health check failed"
            curl -f http://46.62.142.3:4002/health || echo "property-service health check failed"
            curl -f http://46.62.142.3:4003/health || echo "room-service health check failed"
            curl -f http://46.62.142.3:4004/health || echo "tenant-service health check failed"
            curl -f http://46.62.142.3:4006/health || echo "complaint-service health check failed"
            curl -f http://46.62.142.3:4007/health || echo "kitchen-service health check failed"
            curl -f http://46.62.142.3:4008/health || echo "dashboard-service health check failed"
            curl -f http://46.62.142.3:4009/health || echo "notification-service health check failed"
            curl -f http://46.62.142.3:4010/health || echo "payment-service health check failed"
            curl -f http://46.62.142.3:4000/health || echo "gateway health check failed"
            curl -f http://46.62.142.3:4011/health || echo "websocket-service health check failed"
            
            # Cleanup old images
            docker system prune -f

