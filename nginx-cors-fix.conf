# NGINX CORS Fix Configuration
# This configuration needs to be applied to the nginx server to fix CORS issues
# The current nginx config is setting wildcard headers that conflict with credentials

# Location block for the API endpoints
location /api/ {
    # Remove any existing CORS headers to prevent conflicts
    more_clear_headers 'Access-Control-Allow-Origin';
    more_clear_headers 'Access-Control-Allow-Methods';
    more_clear_headers 'Access-Control-Allow-Headers';
    more_clear_headers 'Access-Control-Allow-Credentials';
    
    # Set CORS headers based on origin
    set $cors_origin "";
    set $cors_credentials "";
    
    # Check if origin is in allowed list
    if ($http_origin ~* ^https?://(purple-pgs\.space|www\.purple-pgs\.space|api\.purple-pgs\.space|owner\.purple-pgs\.space|tenant\.purple-pgs\.space|admin\.purple-pgs\.space)$) {
        set $cors_origin $http_origin;
        set $cors_credentials "true";
    }
    
    # For local development
    if ($http_origin ~* ^https?://localhost:(5173|5174|5175)$) {
        set $cors_origin $http_origin;
        set $cors_credentials "true";
    }
    
    # Set the headers only if origin is allowed
    add_header 'Access-Control-Allow-Origin' $cors_origin always;
    add_header 'Access-Control-Allow-Credentials' $cors_credentials always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS, PATCH' always;
    add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, x-user, x-debug, Accept, Origin, X-Requested-With' always;
    
    # Handle preflight requests
    if ($request_method = 'OPTIONS') {
        add_header 'Access-Control-Allow-Origin' $cors_origin always;
        add_header 'Access-Control-Allow-Credentials' $cors_credentials always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS, PATCH' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, x-user, x-debug, Accept, Origin, X-Requested-With' always;
        add_header 'Access-Control-Max-Age' 86400 always;
        return 204;
    }
    
    # Proxy to the application
    proxy_pass http://localhost:3001;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Alternative simpler approach if the above doesn't work:
# Comment out or remove the existing CORS headers in nginx and let the application handle them entirely
# This can be done by removing or commenting these lines in the main nginx config:
# add_header 'Access-Control-Allow-Origin' '*' always;
# add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS, PATCH' always;
# add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, x-user, x-debug' always;
# add_header 'Access-Control-Allow-Credentials' 'true' always;
