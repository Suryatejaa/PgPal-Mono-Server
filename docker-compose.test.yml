# docker-compose.test.yml
services:
  gateway:
    build: ./gateway
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=development
      - USE_HTTPS=false
    volumes:
      - ./gateway:/app
      - /app/node_modules
    working_dir: /app
    command: npx nodemon server.js  # ✅ Use npx
    depends_on:
      - auth-service

  auth-service:
    build: ./auth-service
    ports:
      - "4001:4001"
    environment:
      - NODE_ENV=development
      - PORT=4001
      - MONGO_URI=mongodb+srv://purplepgstays:azx2n5xCf55NcFNM@cluster0.g9pxhyr.mongodb.net/pgpaal_auth_service?retryWrites=true&w=majority
      - REDIS=redis://default:olSyNYOqffHjLRrsMWcnBVqQrRNOkCdL@nozomi.proxy.rlwy.net:33219
      - JWT_SECRET=${JWT_SECRET}
      - REFRESH_TOKEN_SECRET=${REFRESH_TOKEN_SECRET}
      - EMAIL=${EMAIL}
      - EMAIL_PASSWORD=${EMAIL_PASSWORD}   
    volumes:
      - ./auth-service:/app
      - ./shared:/app/shared
      - /app/node_modules
    working_dir: /app
    command: npx nodemon app.js  # ✅ Use npx instead of npm run dev
    restart: unless-stopped