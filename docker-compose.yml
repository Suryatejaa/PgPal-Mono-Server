services:
  auth-service:
    build: 
      context: ./auth-service
      dockerfile: dockerfile
    # 1. SET NETWORK MODE TO HOST to guarantee outbound connections work.
    network_mode: "host"
    env_file:
      - .env
    restart: always
    healthcheck:
      # Healthcheck now uses localhost because it's on the host network
      test: ["CMD", "curl", "-f", "http://localhost:4001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # 2. REMOVED PORTS MAPPING - Not needed with network_mode: "host"
    # 3. REMOVED DNS - Not needed with network_mode: "host"
    environment:
    - MONGO_URI=mongodb+srv://${MONGO_USER}:${MONGO_PASS}@${MONGO_CLUSTER}/pgpaal_auth_service?retryWrites=true&w=majority
    - JWT_SECRET=${JWT_SECRET}
    - REFRESH_TOKEN_SECRET=${REFRESH_TOKEN_SECRET}
    - PORT=4001
    - EMAIL=${EMAIL}
    - EMAIL_PASSWORD=${EMAIL_PASSWORD}
    - BASE_URL=http://localhost:8080
    - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
    - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
    - GOOGLE_CALLBACK_URL=http://localhost:4000/api/auth-service/google/callback
    - PRIVATE_KEY_ID=${PRIVATE_KEY_ID}
    - PRIVATE_KEY=${PRIVATE_KEY}
    - WEBSOCKET_URL=ws://gateway:4011
    - REDIS=${REDIS}
    - NODE_ENV=${NODE_ENV}
    - FRONTEND_URL=https://purple-pgs.space
    - CLIENT_URL=https://purple-pgs.space
    - COOKIE_DOMAIN=.purple-pgs.space

  property-service:
