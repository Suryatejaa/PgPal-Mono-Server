services:
  auth-service:
    build: ./auth-service
    ports:
      - "4001:4001"
    environment:
    - MONGO_URI=mongodb+srv://${MONGO_USER}:${MONGO_PASS}@${MONGO_CLUSTER}/pgpaal_auth_service?retryWrites=true&w=majority
    - JWT_SECRET=your_jwt_secret
    - REFRESH_TOKEN_SECRET=your_refresh_token_secret
    - PORT=4001
    - EMAIL=${EMAIL}
    - EMAIL_PASSWORD=${EMAIL_PASSWORD}
    - BASE_URL=http://localhost:8080
    - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
    - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
    - GOOGLE_CALLBACK_URL=http://localhost:4000/api/auth-service/google/callback
    - PRIVATE_KEY_ID=${PRIVATE_KEY_ID}
    - PRIVATE_KEY=${PRIVATE_KEY}
    - NODE_ENV=${NODE_ENV}
    - WEBSOCKET_URL=ws://websocket-service:4011
    - REDIS=${REDIS}  # Use Railway Redis from .env
    #depends_on:
      # - mongo

  property-service:
    build: ./property-service
    ports:
      - "4002:4002"
    environment:
      - MONGO_URI=mongodb+srv://${MONGO_USER}:${MONGO_PASS}@${MONGO_CLUSTER}/pgpaal_property_service?retryWrites=true&w=majority 
      - JWT_SECRET=${JWT_SECRET}
      - PORT=4002
      - WEBSOCKET_URL=ws://websocket-service:4011
      - REDIS=${REDIS}  # Use Railway Redis from .env
    #depends_on:
      # - mongo

  room-service:
    build: ./room-service
    ports:
      - "4003:4003"
    environment:
      - MONGO_URI=mongodb+srv://${MONGO_USER}:${MONGO_PASS}@${MONGO_CLUSTER}/pgpaal_room_service?retryWrites=true&w=majority
      - REDIS=${REDIS}  # Use Railway Redis from .env
      - JWT_SECRET=${JWT_SECRET}
      - PORT=4003
      - ADMIN_SESSION_TIMEOUT=3600000
      - BCRYPT_ROUNDS=12
      - WEBSOCKET_URL=ws://websocket-service:4011
      # Admin System Configuration
      - ADMIN_RATE_LIMIT_WINDOW=900000
      - ADMIN_RATE_LIMIT_MAX=100
      - ADMIN_CACHE_TTL=300
      - ADMIN_LOG_RETENTION_DAYS=90

      # Email Configuration (for notifications)
      - SMTP_HOST=smtp.gmail.com
      - SMTP_PORT=587
      - SMTP_SECURE=false
      - SMTP_USER=admin@test.com
      - SMTP_PASS=test-password
      - EMAIL_FROM=noreply@pgpaal.com
      - EMAIL_FROM_NAME=PG Paal Admin System

      # Slack Integration (disabled for development)
      - SLACK_WEBHOOK_URL=
      - SLACK_CHANNEL=#admin-alerts
      - SLACK_USERNAME=PG-Paal-Bot

      # Webhook Notifications (disabled for development)
      - WEBHOOK_URL=
      - WEBHOOK_SECRET=development-webhook-secret

      # File Storage Configuration
      - EXPORT_DIR=./exports
      - MAX_EXPORT_FILE_SIZE=50000000
      - EXPORT_CLEANUP_INTERVAL=86400000

# Performance & Monitoring
      - HEALTH_CHECK_INTERVAL=300000
      - PERFORMANCE_THRESHOLD_MS=5000
      - MEMORY_THRESHOLD_MB=512

# Feature Flags
      - ENABLE_ADVANCED_ANALYTICS=true
      - ENABLE_BULK_OPERATIONS=true
      - ENABLE_SCHEDULED_REPORTS=false
      - ENABLE_PERFORMANCE_MONITORING=true
      - ENABLE_ACTIVITY_LOGGING=true
      - ENABLE_REAL_TIME_UPDATES=false

# Analytics Configuration
      - ANALYTICS_RETENTION_DAYS=365
      - ANALYTICS_BATCH_SIZE=1000
      - ANALYTICS_CACHE_TTL=1800

# Logging Configuration
      - LOG_LEVEL=debug
      - LOG_FORMAT=combined
      - LOG_FILE_PATH=./logs/admin.log
      - LOG_MAX_SIZE=10m
      - LOG_MAX_FILES=5

# Rate Limiting Configuration
      - RATE_LIMIT_WINDOW_MS=900000
      - RATE_LIMIT_MAX_REQUESTS=100
      - RATE_LIMIT_SKIP_FAILED_REQUESTS=true

# Cache Configuration
      - CACHE_DEFAULT_TTL=300
      - CACHE_MAX_SIZE=1000
      - CACHE_CHECK_PERIOD=600

    #depends_on:
      # - mongo

  tenant-service:
    build: ./tenant-service
    ports:
      - "4004:4004"
    environment:
      - MONGO_URI=mongodb+srv://${MONGO_USER}:${MONGO_PASS}@${MONGO_CLUSTER}/pgpaal_tenant_service?retryWrites=true&w=majority
      - REDIS=${REDIS}  # Use Railway Redis from .env
      - JWT_SECRET=${JWT_SECRET}
      - PORT=4004
      - EMAIL=${EMAIL}
      - WEBSOCKET_URL=ws://websocket-service:4011
      - EMAIL_PASSWORD=${EMAIL_PASSWORD}
    #depends_on:
      # - mongo

  payment-service:
    build: ./payment-service
    ports:
      - "4010:4010"
    environment:
      - MONGO_URI=mongodb+srv://${MONGO_USER}:${MONGO_PASS}@${MONGO_CLUSTER}/pgpaal_payment_service?retryWrites=true&w=majority
      - REDIS=${REDIS}  # Use Railway Redis from .env
    #depends_on:
      # - mongo

  complaint-service:
    build: ./complaint-service
    ports:
      - "4006:4006"
    environment:
      - MONGO_URI=mongodb+srv://${MONGO_USER}:${MONGO_PASS}@${MONGO_CLUSTER}/pgpaal_complaints_service?retryWrites=true&w=majority
      - JWT_SECRET=${JWT_SECRET}
      - PORT=4006
      - EMAIL=echoliftagency@gmail.com
      - EMAIL_PASSWORD=dinh blaq osyc cpds
      - WEBSOCKET_URL=ws://websocket-service:4011
      - REDIS=${REDIS}  # Use Railway Redis from .env
    #depends_on:
      # - mongo

  kitchen-service:
    build: ./kitchen-service
    ports:
      - "4007:4007"
    environment:
      - MONGO_URI=mongodb+srv://${MONGO_USER}:${MONGO_PASS}@${MONGO_CLUSTER}/pgpaal_kitchen_service?retryWrites=true&w=majority
      - REDIS=${REDIS}  # Use Railway Redis from .env
      - JWT_SECRET=${JWT_SECRET}
      - PORT=4007
      - WEBSOCKET_URL=ws://websocket-service:4011
    #depends_on:
      # - mongo

  dashboard-service:
    build: ./dashboard-service
    ports:
      - "4008:4008"
    environment:
      - MONGO_URI=mongodb+srv://${MONGO_USER}:${MONGO_PASS}@${MONGO_CLUSTER}/pgpaal_dashboard_service?retryWrites=true&w=majority
      - REDIS=${REDIS}  # Use Railway Redis from .env
      - JWT_SECRET=${JWT_SECRET}
      - PORT=4008
    #depends_on:
      # - mongo

  notification-service:
    build: ./notification-service
    ports:
      - "4009:4009"
    environment:
      - MONGO_URI=mongodb+srv://${MONGO_USER}:${MONGO_PASS}@${MONGO_CLUSTER}/pgpaal_notification_service?retryWrites=true&w=majority
      - REDIS=${REDIS}  # Use Railway Redis from .env
      - JWT_SECRET=${JWT_SECRET}
      - PORT=4009
    #depends_on:
      # - mongo 

  notification-worker:
    build: ./notification-service
    command: node src/workers/notificationWorker.js
    environment:
      - MONGO_URI=mongodb+srv://${MONGO_USER}:${MONGO_PASS}@${MONGO_CLUSTER}/pgpaal_notification_service?retryWrites=true&w=majority
      - REDIS=${REDIS}  # Use Railway Redis from .env
      - JWT_SECRET=${JWT_SECRET}
      - PORT=4009
    #depends_on:
      - notification-service

  websocket-service:
    build:
      context: ./websocket-service
    ports:
      - "4011:4011"
    environment:
      - REDIS_URL=${REDIS}  # Use Railway Redis from .env
      - NODE_ENV=${NODE_ENV}
    depends_on:
      - redis
    networks:
      - pgpaal-network
    restart: unless-stopped

  gateway:
    build: ./gateway
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=development

