  gateway:
    build:
      context: ./gateway
      dockerfile: dockerfile
    # image: ghcr.io/suryatejaa/pgpal-mono-server/gateway:latest
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    ports:
      - "4000:4000"
      - "4011:4011"  # WebSocket port
    environment:
      - NODE_ENV=${NODE_ENV}
      - REDIS=${REDIS}  # Use Railway Redis from .env
      - PORT=4000
      - USE_HTTPS=true
      - WEBSOCKET_PORT=4011
      - FRONTEND_URL=https://purple-pgs.space
      - CLIENT_URL=https://purple-pgs.space
      - ADMIN_URL=https://admin.purple-pgs.space
      - OWNER_URL=https://owner.purple-pgs.space
      - TENANT_URL=https://tenant.purple-pgs.space
